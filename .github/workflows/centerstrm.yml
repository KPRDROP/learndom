name: StreamCenter Updater

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright selectolax httpx[http2] pytz tzdata adblock
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run StreamCenter updater
        env:
          CENTERSTRM_API: ${{ secrets.CENTERSTRM_API }}
          ALT_CENTERSTRM_API: ${{ secrets.ALT_CENTERSTRM_API }}
        run: |
          echo "Starting StreamCenter updater..."
          python centerstrm.py

      - name: Commit and push playlists
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add centerstrm.m3u8 centerstrm_tivi.m3u8
          git diff --quiet && git diff --staged --quiet || git commit -m "Update StreamCenter playlists [skip ci]"
          git push
