name: SPORTSG Updater

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sportsg
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright "httpx[http2]" pytz "tzdata>=2026.3" "adblock>=0.6.0"
          playwright install
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python sportsg.py

      - name: Commit & push outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f sportsg_vlc.m3u8 sportsg.tivimate.m3u8 || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update SPORTSG playlists [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
