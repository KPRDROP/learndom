name: FUTLX updater

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futlx-updater
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright "httpx[http2]" pytz "tzdata>=2026.3" "adblock>=0.6.0"

      - name: Run FUTLX updater
        run: |        
         echo "Starting FUTLX updater..."
         python -m futlx

      - name: Commit & push changes
        run: |
          if [[ -z "$(git status --porcelain futlx_vlc.m3u8 futlx_tivimate.m3u8)" ]]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add futlx_vlc.m3u8 futlx_tivimate.m3u8
          git commit -m "Update FUTLX playlist"

          # Sync with remote before pushing, in case another
          # workflow run pushed in the meantime.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && \
              git push origin HEAD:main && \
              break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
