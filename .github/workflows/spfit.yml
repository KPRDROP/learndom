name: SPFIT Updater

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Grant write permissions to push changes
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright aiohttp selectolax httpx[http2] pytz "adblock>=0.6.0"
        playwright install chromium
    
    - name: Install Playwright browsers
      run: |
        playwright install --with-deps chromium
    
    - name: Run SPFIT scraper
      run: |
        python spfit.py
    
    - name: List generated files
      run: |
        echo "Files in current directory:"
        ls -la
        echo ""
        echo "Checking for M3U8 files:"
        ls -la *.m3u8 2>/dev/null || echo "No M3U8 files found"
    
    - name: Push M3U8 files
      run: |
        # Setup git
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add files (force add even if gitignored)
        git add -f spfit_vlc.m3u8 spfit_tivimate.m3u8 || true
        git add -f *.cache || true
        
        # Commit if there are changes
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        # Commit changes
        git commit -m "🔄 Auto-update SPFIT M3U8 streams [skip ci]"
        
        # Push to main branch
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main --force
