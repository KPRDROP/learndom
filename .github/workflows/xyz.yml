name: XYZ Playlist Generator

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright aiohttp selectolax httpx[http2] pytz "adblock>=0.6.0"
          playwright install chromium

      - name: Run SHOPP generator
        run: |
          python xyz.py

      - name: Commit and push playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add xyz_vlc.m3u8 xyz_tivimate.m3u8

          if git diff --cached --quiet; then
            echo "No playlist changes"
            exit 0
          fi

          git commit -m "Auto-update XYZ playlists"

          git pull --rebase origin main
          git push origin main
