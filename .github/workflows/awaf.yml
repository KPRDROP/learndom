name: FAWA Updater

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awaf-updater
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright selectolax "httpx[http2]" tzdata pytz adblock
          python -m playwright install --with-deps chromium

      - name: Run FAWA updater
        run: |
          echo "Starting AWAF updater..."
          python awaf.py

      - name: Commit & push changes
        run: |
          if [[ -z "$(git status --porcelain awaf.m3u awaf_tivimate.m3u)" ]]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add awaf.m3u awaf_tivimate.m3u
          git commit -m "Update Awaf playlist"

          # Sync with remote before pushing, in case another
          # workflow run pushed in the meantime.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && \
              git push origin HEAD:main && \
              break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
